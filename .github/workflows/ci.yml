name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Committed dist matches a fresh build
        run: |
          npm run build
          git diff --exit-code -- dist

      - name: Policy smoke test
        # Decisions are free: this exercises the CLI end to end without spending tokens.
        run: |
          node dist/src/cli.js explain --base HEAD~1 --head HEAD --json > explain.json
          grep -q '"decision"' explain.json
          grep -o '"code": "[a-z-]*"' explain.json | head -1
          cat explain.json
