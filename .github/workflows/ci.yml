name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Committed dist matches a fresh build
        run: |
          npm run build
          git diff --exit-code -- dist

      - name: Policy smoke test
        # Decisions are free: this exercises the CLI end to end without spending tokens.
        run: |
          node dist/src/cli.js explain --base HEAD~1 --head HEAD --json > explain.json || true
          node -e "const p=require('./explain.json'); if(!p.decision || !p.decision.code) { throw new Error('explain produced no decision'); } console.log('decision:', p.decision.code);" || true
          cat explain.json
